# SHA-256, at three scales, without a cut.
#
#   cuecraft render examples/sha256/sha256.yaml -o out/sha256.mp4
#
# One slide. The camera descends into the step that does the work, descends again twice inside
# it, and unwinds through the same scopes to finish the sentence it started.
#
# SHA-256 was not designed for cuecraft, which is the point of using it: it is a call stack
# because that is how FIPS 180-4 is written. `sha256` compresses each block; `compress` builds a
# message schedule and then runs a round; the round calls Ch, Maj and two big sigmas.
#
# Three vocabularies are doing three different jobs, and the difference is the whole design:
#
#   child:    an interior that narrates itself     -> going in is a *call*      (decision:31)
#   detail:   an interior a sentence points at     -> going in is a *look*      (decision:25)
#   series:   a population with a size             -> a sentence fills it up    (decision:33)
#
# The last one is why this film was rebuilt. cuecraft could show one round and could only
# *assert* that it happens sixty-four times; now the sixty-four are watched arriving, over a
# sentence whose length is the measured length of the sentence.
#
# Everything on screen is checked. `src/examples.test.ts` reads the rotation and shift amounts
# out of the TeX in these files, runs a reference SHA-256 with them, and compares the digest
# against node:crypto — so a deck that misstates the algorithm fails the suite, not the viewer.

title: "Anything in, sixty-four characters out"

defaults:
  pre_say: 700ms
  post_say: 2.2s
  voice: af_heart

slides:
  - slide:
      title: "How a hash gets made"

      world:
        entities:
          anything: Anything at all
          padded: Padded to a tidy size
          blocks: Cut into blocks

          # The only entity that says anything for itself. Its label is what this world calls
          # it and what its own world is titled — the same string at two scales.
          squeeze:
            label: The squeeze
            child: ./compression.yaml

          digest: Sixty-four hex digits

        relations:
          - anything -> padded
          - padded -> blocks
          - blocks -> squeeze
          - squeeze -> digest

    say:
      - speech: >
          Git names every object by a hash of its contents. Change one character, and the name
          changes completely. Most repositories use SHA-1; this is its successor.
        activates: anything

      - speech: >
          First, padding: a one bit, then zeros, then the original length, until it divides
          exactly into five hundred and twelve.
        activates: padded

      - speech: >
          That gets cut into blocks, taken strictly in order.
        activates: blocks

      - speech: >
          Eight thirty-two-bit words travel alongside. Every block is squeezed into them,
          starting from what the block before it left.
        activates: squeeze

      # The descent. From here until the module's narration runs out, this slide says nothing.
      - enter: squeeze

      # ...and here is where it resumes.
      - speech: >
          Those eight words are the answer. Eight times thirty-two is two hundred and fifty-six
          bits — sixty-four hexadecimal digits.
        activates: digest

      # A closing remark that reaches nothing, which is how the camera is asked to pull back
      # and show the whole thing at once (decision:22).
      - speech: >
          Change one bit going in, and about half the bits coming out flip. Going back has no
          shortcut better than guessing — fast enough, if what you hashed was a PIN.
