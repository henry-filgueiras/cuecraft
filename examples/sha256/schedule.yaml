# Inside `stretch` — a grandchild module, entered from examples/sha256/compression.yaml.
#
# Two levels below the slide, and this file has no idea of that. It names its entities locally
# and is resolved relative to the file that declared it.
#
# Both kinds of interior appear here, doing what each is for. `recur` carries a `detail:` — the
# recurrence has nothing to say for itself, it is what the sentence above it points at. `all`
# carries a `series:` — forty-eight words arriving is not a picture, it is a quantity.

world:
  entities:
    first: The first sixteen
    recur:
      label: Built from four earlier
      detail:
        formula:
          - tex: 'W_t \;=\; \sigma_1(W_{t-2}) \,+\, W_{t-7} \,+\, \sigma_0(W_{t-15}) \,+\, W_{t-16}'
          - tex: '\sigma_0(x) \;=\; \mathrm{ROTR}^{7}(x) \oplus \mathrm{ROTR}^{18}(x) \oplus \mathrm{SHR}^{3}(x)'
          - tex: '\sigma_1(x) \;=\; \mathrm{ROTR}^{17}(x) \oplus \mathrm{ROTR}^{19}(x) \oplus \mathrm{SHR}^{10}(x)'

    all:
      label: Sixty-four words
      detail:
        series:
          # No identity, so these are simply *there* the moment the boundary opens: they arrived
          # with the block and were never built.
          - count: 16
            text: arrive with the block
          - id: derived
            count: 48
            text: built from four earlier words each

  relations:
    - first -> recur
    - recur -> all

say:
  - speech: >
      The first sixteen words are the block itself.
    activates: first

  - speech: >
      Every word after is built from four earlier ones. Two are smeared first by the small
      sigmas — rotate, rotate, shift, fold.
    activates: recur

  - speech: >
      So sixteen words arrive with the block itself, and then the building starts.
    activates: all

  - speech: >
      And forty-eight more are built out of them, one at a time, until there are sixty-four.
    fills: derived

  - speech: >
      One for every round, and nothing new came in.
