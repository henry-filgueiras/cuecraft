# Inside `round` — the second grandchild, entered from examples/sha256/compression.yaml after
# the schedule has been visited and left.
#
# This is FIPS 180-4 section 6.2.2 step 3, and the thing it exists to get right is that a round
# injects *two* new values rather than one. The previous cut of this film said only that
# everything shifts down, which is true of six of the eight words and wrong about the two that
# matter.

world:
  entities:
    inputs: Eight words, plus two

    sums:
      label: Two sums
      detail:
        formula:
          # The four ingredients carry no identity, so they are simply *there* the moment the
          # boundary opens: the sentence that opened it is already about all four.
          - tex: '\mathrm{Ch}(e,f,g) \;=\; (e \wedge f) \oplus (\lnot e \wedge g)'
          - tex: '\mathrm{Maj}(a,b,c) \;=\; (a \wedge b) \oplus (a \wedge c) \oplus (b \wedge c)'
          # The big sigmas, which are *not* the schedule's small ones — different distances, and
          # three rotations rather than two rotations and a shift.
          - tex: '\Sigma_0(a) \;=\; \mathrm{ROTR}^{2}(a) \oplus \mathrm{ROTR}^{13}(a) \oplus \mathrm{ROTR}^{22}(a)'
          - tex: '\Sigma_1(e) \;=\; \mathrm{ROTR}^{6}(e) \oplus \mathrm{ROTR}^{11}(e) \oplus \mathrm{ROTR}^{25}(e)'
          # The two results do carry one, so each stays recessive until its own sentence arrives.
          - id: t1
            tex: 'T_1 \;=\; h + \Sigma_1(e) + \mathrm{Ch}(e,f,g) + K_t + W_t'
          - id: t2
            tex: 'T_2 \;=\; \Sigma_0(a) + \mathrm{Maj}(a,b,c)'

    inject:
      label: Two get new values
      detail:
        formula:
          - tex: 'a \;\leftarrow\; T_1 + T_2'
          - tex: 'e \;\leftarrow\; d + T_1'

    shift: The other six move down

  relations:
    - inputs -> sums
    - sums -> inject
    - inject -> shift

say:
  - speech: >
      A round takes the eight slots, plus this round's schedule word and one of sixty-four
      constants.
    activates: inputs

  - speech: >
      All of it goes into two sums, built from four pieces.
    activates: sums

  - speech: >
      Choose: one word picks between two others, bit by bit. Majority: three of them vote.
      And two big sigmas.

  - speech: >
      T one gathers h, the big sigma of e, choose, the constant and the word.
    activates: t1

  - speech: >
      T two is the big sigma of a, plus majority.
    activates: t2

  - speech: >
      T one plus T two becomes the new a. And d plus T one becomes the new e — two get new
      values, not one.
    activates: inject

  - speech: >
      The other six shift down a place.
    activates: shift

  - speech: >
      Stir, choose, vote, add, shift. Nothing here is clever on its own.
