# The deck where cuecraft's evidence starts moving.
#
#   cuecraft render examples/kmeans/kmeans.yaml -o out/kmeans.mp4
#
# Every other exhibit in this repository is still: R draws a chart, a drawing or a table, and the
# narration walks around it. This one hands back an MP4, and the slide plays it.
#
# What is worth noticing in the source is how little of it there is. `play: kmeans` starts it, and
# `during: pass-3` stops it. There is no duration, no start, no end, no rate and no frame number
# anywhere in this file — the film measured itself and named the states it reaches, and cuecraft cut
# it at the one this deck talks about, before a single frame existed (decision:64, decision:65).
#
# The three sentences at `pass-3` are one rendezvous, not three. The film stops once, all of them
# are spoken over the held frame, and then it carries on from exactly where it stopped.
#
# `replay: pass-2` in the middle of that is the same mechanism again with two numbers changed: it
# shows the interval between two states the film named, slower, and then the picture returns to the
# frame it was frozen on. Nothing in the timeline knows the word "replay".
#
# The film then stops a second time, at `converged`. What the timeline ends up with is
#
#     slice   aside   replay   aside   slice   aside   slice
#
# — seven ordinary occupants of one cursor, and not one of them is a special case.
#
# Needs ffmpeg on PATH: kmeans.R encodes with it. ./scripts/bootstrap-r.sh says so if it is absent.

title: "A computation you can watch"

defaults:
  pre_say: 700ms
  post_say: 1200ms
  subtitles: true

slides:
  - slide:
      title: "Three clusters, and nobody knows where they are"
      steps:
        - id: guess
          text: "Guess three centres"
        - id: assign
          text: "Give every point to its nearest one"
        - id: move
          text: "Move each centre to the middle of what it got"
        - id: repeat
          text: "Do it again until nothing changes"

    say:
      - "K-means is four lines long, and three of them are a loop."
      - speech: "Start by guessing. Pick three points and call them the centres."
        activates: guess
      - speech: "Then every point in the cloud joins whichever centre is nearest to it."
        activates: assign
      - speech: "Then each centre moves to the middle of whatever just joined it."
        activates: move
      - speech: "And that is the whole algorithm. Do it again, until a pass changes nothing."
        activates: repeat
      - pause: 400ms
      - "Written down, that is a description. What it does not tell you is what convergence looks like."

  # The temporal exhibit. `run:` and `with:` are the same two keys every other exhibit has;
  # what makes this one move is that the program declared a film rather than a picture.
  - slide:
      title: "Two hundred and six points"
      exhibit:
        run: examples/kmeans/kmeans.R
        with:
          points: examples/kmeans/points.csv

    say:
      - "While this was compiling, R ran that loop over two hundred and six points."
      - "It drew every frame of the run rather than a chart, and handed back a film."
      - play: kmeans
      - speech: "Hold it there. One centre has just crossed the sparse middle."
        during: pass-3
      - speech: "That took about a second. Watch it again, slower."
        during: pass-3
      - replay: pass-2
      - speech: "Forty-four points changed hands, and the right-hand group is new."
        during: pass-3
      - speech: "Now let it finish. Three passes later, nothing moves at all."
        during: converged
      - "That is how the loop knows to stop: a pass in which no point changes hands."

  - slide:
      title: "What the deck said about that"
      code:
        file: examples/kmeans/kmeans.yaml
        slide: "Two hundred and six points"
        opens: "say:"
        marks:
          - id: verb
            line: "play: kmeans"
          - id: hold
            line: "Hold it there"
          - id: again
            line: "replay: pass-2"

    say:
      - speech: "One word starts the film."
        activates: verb
      - speech: "A sentence that names a state the film reaches stops it there."
        activates: hold
      - speech: "And one word runs an interval of it again, between two states it named."
        activates: again
      - "There is no length in this file. No start, no end, no rate, and no frame number."
      - "The film measured itself, named the passes it goes through, and cuecraft cut it at the one this deck talks about."

  - slide:
      title: "One clock, still"

    say:
      - "Nothing about that slide is a second timeline."
      - pause: 350ms
      - "The film did not ask for time and could not have. It was measured, it was placed, and everything after that is the arithmetic every other slide already used."
      - pause: 400ms
      - "Which is the interesting part. A presentation compiler can hold up something that moves without becoming a video editor."
      - pause: 500ms
      - "The evidence has a clock of its own. The film it lands in does not have to care."
