# cuecraft, explaining itself.
#
#   cuecraft render examples/cuecraft.yaml -o out/cuecraft.mp4
#
# Seven scenes, about a hundred seconds. The argument is: presentations are usually authored
# as mechanics, cuecraft asks for intent instead, and everything mechanical is derived from it.
#
# Three of the scenes put cuecraft source on screen, because the claim is only worth making if
# a viewer can check it — and none of the three carries a copy of that source. Two quote a
# slide of examples/witnessglass.yaml; the last quotes this slide, out of this file. A quote
# cannot go stale, and a file that quotes itself terminates, because a reference is not an
# inclusion.
#
# The third scene shows one source becoming another. Which lines differ is not written down
# anywhere here: cuecraft diffs the two states, and the narration reaches the changed region by
# an identity the compiler declared on its own.
#
# Nothing in this file says where anything goes, how big it is, or when it happens.

title: "cuecraft: author relationships, derive mechanics"

defaults:
  pre_say: 700ms
  post_say: 1100ms

slides:
  # 1 — THE PROBLEM, in the viewer's own vocabulary before it is taken away from them.
  # A slide that is one sentence and nothing else.
  - slide:
      title: "Presentations are built out of boxes, pixels and seconds"

    # A beat before the turn. The second sentence is the whole reason for the first.
    pre_say: 1000ms
    say:
      - "A presentation is usually built out of boxes, pixels and seconds."
      - pause: 450ms
      - "None of that is what you meant to say."

  # 2 — THE SOURCE. The centre of the video: a real cuecraft slide, shown whole, with the
  # narration walking its three parts. What is on screen is what an author actually types —
  # and it is not a copy of it. The slide is quoted out of the other deck in this repository,
  # by its title, so it is the file's own text or the render fails.
  - slide:
      title: "One slide, in full"
      code:
        file: examples/witnessglass.yaml
        slide: "Coding agents are black boxes"

        # Three parts of the specimen that the narration reaches. Each names the line it
        # opens rather than a line number, so inserting a line above it changes nothing —
        # and a quoted file that stopped containing the line fails loudly instead of
        # emphasising the wrong region.
        marks:
          - id: content
            line: "slide:"
          - id: narration
            line: "say:"
          - id: link
            line: "activates:"

    say:
      - "So cuecraft asks for something else."
      - speech: "You describe what is on the slide,"
        activates: content
      - speech: "and what to say about it."
        activates: narration
      - pause: 400ms
      - speech: "And when one sentence is about one thing in particular, it says so."
        activates: link
      - pause: 350ms
      - "There is no timeline here. Nothing has a position, and nothing has a time."

  # 3 — THE EVIDENCE, and the claim the earlier cut of this deck could only assert.
  #
  # The scene above showed that slide whole. This one shows the narration half of it, twice:
  # once as it was written before, and once as it is written now. `opens` is the only thing
  # here that decides how much source is on the frame — it names the construct the story is
  # about, and cuecraft shows that construct and nothing around it. It replaced a version of
  # this scene that quoted the whole slide, and the code on that one set at 30px because
  # fourteen lines had to fit so that five of them could be the point.
  #
  # Which lines were removed, which were added, and which are context are all derived. There is
  # no annotation here saying "this line changed", because the compiler can see that itself.
  #
  # And `activates: change` reaches an identity nothing in this file declares. The diff knows
  # which region of itself is the change, so it declares one, scoped to this slide like any
  # other. The author supplies the structure; the compiler supplies the endpoint; the measured
  # audio supplies the moment.
  - slide:
      title: "Change it, and nothing else"
      change:
        before:
          language: yaml
          source: |
            say:
              - "Coding agents do a surprising amount of invisible work."
              - pause: 350ms
              - "They read files, search code, run tools, and decide what to do next."
        after:
          file: examples/witnessglass.yaml
          slide: "Coding agents are black boxes"
          opens: "say:"

    say:
      - "Here is the narration half of that slide, as it was written first."
      - pause: 350ms
      - speech: "One sentence was split, and the half about tools was pointed at the term for it."
        activates: change
      - pause: 500ms
      - "Nothing in that edit is a time, or a frame, or a position."
      - pause: 250ms
      - "So there is nothing to go back and fix. It is spoken again, measured again, and timed again."

  # 4 — WHAT HAPPENS TO IT. Stages of one transformation, not a list of features: each stage
  # consumes the one before it, and the narration walks them in order.
  - slide:
      title: "Then it works out the rest"
      steps:
        - id: speech
          text: Speech
        - id: timing
          text: Timing
        - id: composition
          text: Composition
        - id: video
          text: Video

    say:
      - "Everything else is derived."
      - speech: "The narration is spoken locally, on your machine."
        activates: speech
      - speech: "Its real duration becomes the slide's duration."
        activates: timing
      - speech: "The shape of the content chooses the composition."
        activates: composition
      - speech: "And the whole thing is rendered."
        activates: video

  # 5 — THE CONSEQUENCE, stated as absence. Four parallel terms, each struck off by name.
  - slide:
      title: "Things you never write"
      bullets:
        - id: coordinates
          text: Coordinates
        - id: durations
          text: Durations
        - id: keyframes
          text: Keyframes
        - id: layouts
          text: Layouts

    say:
      - "So there are things you never write."
      - speech: "No coordinates."
        activates: coordinates
      - speech: "No durations."
        activates: durations
      - speech: "No keyframes."
        activates: keyframes
      - speech: "And no layout to pick."
        activates: layouts

  # 6 — THE RESULT. The calm scene after the cascade, and the one that says what you are left
  # holding: a file, not a runtime.
  - slide:
      title: "What comes out is an ordinary video"
      bullets:
        - One file, with the narration already mixed into it
        - Nothing to install, and nothing to play it back with
        - A source small enough to read in about a minute

    say:
      - "What comes out is an ordinary video."
      - pause: 300ms
      - "One file, with the narration already mixed in. Nothing to install."

  # 7 — THE CLOSE, and the recursion in the deck. The specimen on screen is this slide's own
  # source, quoted out of this file by its own title, so what you are reading is what produced
  # the frame you are reading it on — including the two lines that put it there. It used to be
  # a copy that stopped one level short. A quote does not have to: it names the source instead
  # of containing it, so there is no regress to cut.
  #
  # `post_say` gives the last frame room to land rather than cutting on the final syllable.
  # It sits inside the quoted region, so it is on screen too — the comment explaining it is
  # up here, where the quote cannot reach.
  - slide:
      title: "Author relationships. Derive mechanics."
      code:
        file: examples/cuecraft.yaml
        slide: "Author relationships. Derive mechanics."

    post_say: 2200ms
    say:
      - "That is this slide, in full."
      - pause: 600ms
      - "Author relationships."
      - pause: 400ms
      - "Derive mechanics."
