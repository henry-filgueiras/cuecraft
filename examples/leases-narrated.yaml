# The same job runner, explained as its run rather than as its machine.
#
#   cuecraft render examples/leases-narrated.yaml -o out/leases-narrated.mp4
#
# `examples/leases.yaml` declares this exact machine and this exact scenario, and differs from it
# by one key: `scope: narrated`. Everything else below — every state, every transition, every
# occurrence, every sentence — is byte-identical to its sibling. The pair exists so that the two
# pictures of one machine can be compared rather than argued about.
#
# What the key does (decision:54): the run chooses the states — the endpoints of the transitions it
# takes — and the machine then contributes every transition it declares between them. The frame says
# so, in counts, under the title. Six of nine states, nine of fourteen transitions.
#
# It is the *induced subgraph* rather than merely the taken transitions, and the difference shows up
# on this very machine: `resumed` (Cancelling -> Running) is never taken, and it stays, because
# dropping it would make Cancelling look like a state with one exit when the machine says it has
# two — and would delete the referent of this film's own closing sentence about "the road back out
# of cancelling".
#
# What that buys, measured through the real pipeline rather than a layout score:
#
#                        states     atlas    camera moves   below the 20px floor
#   scope: whole         9st 14tr   16.3px      6 / 13            6 / 13
#   scope: narrated      6st  9tr   27.9px      0 / 13            0 / 13
#
# The reduced film stops needing a camera at all: thirteen occurrences, all at 28px, from one held
# overview. dragon:28 — four transitions never legible in any frame — does not exist here.
#
# What it costs, and the cost is the reason the key is opt-in and off by default. `succeeded` and
# `failed` are gone from the map, and so is the road back out of `cancelling`, and so is the whole
# `orphaned` detour. A viewer of this film cannot learn what else the job could have done. The
# closing narration below still says `succeeded` and `failed` are "still sitting there", which is
# now a sentence about two states the frame is not showing — and that tension is exactly what this
# pair is for. "The road back out of cancelling", in the same sentence, is still on screen.
#
# `examples/elevator.yaml` refuses this key, for the reason its own header gives: the branch the
# doors did not go down is why the branch they did go down means anything.
#
# Nothing here is special-cased anywhere in the implementation, and this file contains no
# coordinate, no colour, no duration and no camera instruction.

title: "A job with a lease on it"

defaults:
  pre_say: 900ms
  # The closing silence, and it is no longer buying the closing shot.
  #
  # sprint:19 set this to nine seconds because the pull-back to the whole machine was a camera
  # move of its own and the film was spending almost all of the post-roll *travelling* rather
  # than on the settled overview it travelled to. That was the author paying, in silence, for a
  # framing decision — decision:22's rule stretched about as far as it goes.
  #
  # The planner now budgets the closing shot itself: it starts the pull-back late enough that a
  # fixed, bounded settle follows it, and anything written beyond that is spent holding the last
  # occurrence rather than sitting on the overview. So this is back to being what it says it is —
  # a beat of silence at the end — and it was measured rather than guessed: nine seconds was
  # four and a third of camera travel and four and two thirds of held overview, and the held
  # overview is worth about three.
  post_say: 4000ms

slides:
  - slide:
      title: "A job with a lease on it"

      machine:
        # The whole point of this file. Same machine, same run, one key different.
        scope: narrated

        states:
          queued: Queued
          claimed: Claimed
          running: Running
          retry: Retry wait
          orphaned: Orphaned
          cancelling: Cancelling
          cancelled: Cancelled
          succeeded: Succeeded
          failed: Failed

        transitions:
          claim:
            from: queued
            to: claimed
            on: a worker takes the lease

          start:
            from: claimed
            to: running
            on: handler begins

          heartbeat:
            from: running
            to: running
            on: lease renewed

          timed-out:
            from: running
            to: retry
            on: handler exceeds its deadline

          rate-limited:
            from: running
            to: retry
            on: downstream returns 429

          backoff-expiry:
            from: retry
            to: queued
            on: backoff expires

          lease-lost:
            from: claimed
            to: orphaned
            on: lease lost before the first heartbeat

          commit-in-flight:
            from: running
            to: orphaned
            on: visibility timeout expires while the result commit is still in flight

          reclaimed:
            from: orphaned
            to: queued
            on: the reaper reclaims it

          cancel:
            from: running
            to: cancelling
            on: an operator cancels

          resumed:
            from: cancelling
            to: running
            on: cancellation withdrawn

          drained:
            from: cancelling
            to: cancelled
            on: handler acknowledges

          done:
            from: running
            to: succeeded
            on: result committed

          gave-up:
            from: running
            to: failed
            on: attempt budget exhausted

        scenario:
          - take: claim
            say:
              "A job is not assigned to a worker. It is left in a queue, and a worker takes a
              lease on it — which is a promise to keep saying it is still alive."

          - take: start

          - take: heartbeat
            say:
              "That is the promise being kept. Nothing has moved: the job is still running, and
              the only thing that happened is that it said so."

          - take: timed-out
            say:
              "Then it misses a deadline. Notice where that puts it — not failed, and not
              orphaned, but waiting to be tried again."

          - take: backoff-expiry

          - take: claim

          - take: start
            say:
              "So the second attempt begins the same way the first one did, on a different worker,
              from the same queue."

          - take: rate-limited
            say:
              "And it comes back to the same waiting state by a completely different road.
              Something downstream is rate limiting it, which is a different problem from being
              slow, and the machine is careful to keep the two apart even though they end up in
              the same place."

          - take: backoff-expiry

          - take: claim

          - take: start

          - take: cancel
            say:
              "The third attempt does not get to find out. Somebody cancels it — and cancelling is
              not something that happens to a job, it is a state the job has to pass through,
              because the handler is still holding a lease and still writing to something."

          - take: drained
            say:
              "It acknowledges, and stops. Which is where this explanation ends, and not where the
              machine does: succeeded and failed are still sitting there, and so is the road back
              out of cancelling."
