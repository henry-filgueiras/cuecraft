# The canonical input for the v0 format, and the acceptance artifact for every
# render change:
#
#   cuecraft render examples/witnessglass.yaml -o out/witnessglass.mp4
#
# This deck is also the design laboratory. Its four slides have deliberately
# different content shapes so that each one selects a different composition —
# nothing here names a layout, and nothing here sets a size or a position.
#
# See archaeology/decisions/0001-*.md (thesis), 0002-*.md (what v0 does and does
# not include), 0009-*.md (how this becomes a video), and 0010-*.md (how a shape
# becomes a composition).

title: "WitnessGlass: What Did the Agent Actually Do?"

defaults:
  pre_say: 750ms
  post_say: 1200ms

slides:
  # Four two-word labels: parallel, terse, no order worth showing -> matrix.
  #
  # Each cue is a separate synthesis call, so each gets a complete intonation
  # contour instead of one long declarative arc.
  #
  # One term carries a semantic identity and one cue reaches it, so this deck
  # exercises the matrix archetype's activation treatment as well as the index
  # archetype's below (decision:17). The comments live above the entry rather
  # than inside it because examples/cuecraft.yaml quotes this slide verbatim.
  - slide:
      title: "Coding agents are black boxes"
      bullets:
        - Read files
        - Search code
        - id: tools
          text: Run tools
        - Decide

    say:
      - "Coding agents do a surprising amount of invisible work."
      - speech: "They read files, search code, and run tools."
        activates: tools
      - "And decide what to do next."

  # A title and nothing else -> statement.
  - slide:
      title: "You see the answer. You never see the work."

    say:
      - "You get the final answer."
      - pause: 500ms
      - "You almost never get to see how the time was actually spent."

  # Four compact phrases whose order is part of the point -> index.
  #
  # This is also the anchored slide. Each bullet carries a semantic identity, and the
  # narration cue that reaches it says so. cuecraft works out *when* from the measured
  # audio; nothing here is a timestamp or a frame. See archaeology/decisions/0014-*.md.
  - slide:
      title: "WitnessGlass records the work"
      bullets:
        - id: tool
          text: Which tool the agent invoked
        - id: timing
          text: How long the call took
        - id: result
          text: What the tool returned
        - id: reason
          text: Why it was called at all

    say:
      # eSpeak reads "records" as the noun after a noun-phrase subject, so this one
      # occurrence is spelled differently for synthesis only — decision:12.
      - speech: "WitnessGlass records every tool call as a structured event."
        pronounce:
          records: rekords
      - speech: "Which tool the agent invoked,"
        activates: tool
      - speech: "how long the call took,"
        activates: timing
      - speech: "what it returned,"
        activates: result
      - speech: "and why it was called at all."
        activates: reason

  # Full sentences, too long to be labels -> lead.
  - slide:
      title: "So the session stops being a black box"
      bullets:
        - Replay a session instead of recalling it
        - Measure where the time actually went
        - Review it the way you review a colleague

    say:
      - "So you can stop guessing."
      - pause: 450ms
      - "Replay the session, measure it, and review it like any other work."
